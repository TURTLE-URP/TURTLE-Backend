services:
  postgres-db:
    image: postgres:18-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${DATABASE_NAME}", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      POSTGRES_USER: ${DATABASE_DEFAULT_SUPERUSER}
      POSTGRES_PASSWORD: ${DATABASE_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      PGUSER: ${DATABASE_DEFAULT_SUPERUSER}
      PGPASSWORD: ${DATABASE_SUPERUSER_PASSWORD}
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - pg-data:/var/lib/postgresql
      - ./database/scripts/initialization:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
  pgadmin:
    image: dpage/pgadmin4:9.14.0
    restart: unless-stopped
    profiles:
      - dbClient
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - ${HOST_PGADMIN_PORT}:80
    volumes:
      - pg-admin-data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
volumes:
  pg-data:
  pg-admin-data:
